<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chain Linking</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div class="card" id="game-card">
    <header class="top">
      <h1 id="title" data-i18n="title">Chain Linking</h1>
      <button id="lang-toggle" aria-label="Toggle language">日本語</button>
    </header>

    <section id="words-section">
      <div id="word-list" aria-label="word list"></div>
      <div class="word-controls">
        <button id="word-minus" aria-label="decrease word count">−</button>
        <span id="word-count">3</span>
        <button id="word-plus" aria-label="increase word count">＋</button>
      </div>
    </section>

    <section id="story-section">
      <textarea id="story" rows="4" placeholder="Write a funny story..." data-i18n="storyPlaceholder" aria-label="story input"></textarea>
      <div id="tip" class="tip"></div>
    </section>

    <section class="buttons">
      <button id="check" class="btn" data-i18n="check" aria-label="check story">Check</button>
      <button id="new-words" class="btn" data-i18n="newWords" aria-label="new words">New Words</button>
      <button id="hint" class="btn" data-i18n="hint" aria-label="hint">Hint</button>
      <button id="tpr" class="btn" data-i18n="tpr" aria-label="TPR idea">TPR idea</button>
      <button id="reset" class="btn" data-i18n="reset" aria-label="reset game">Reset</button>
      <button id="timer-toggle" class="btn" data-i18n="timer" aria-label="toggle timer">Timer:30s</button>
      <button id="copy-link" class="btn" data-i18n="copyLink" aria-label="copy round link">Copy Round Link</button>
    </section>

    <section id="feedback" aria-live="polite"></section>

    <section id="score-board">
      <span id="score-label" data-i18n="score">Score:</span> <span id="score">0</span>
      <span id="timer" class="timer"></span>
    </section>

    <section id="history-section">
      <h2 id="history-title" data-i18n="history">Previous Attempts</h2>
      <ul id="history"></ul>
    </section>

    <div id="emoji-container"></div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>

:root {
  --bg: #fefefe;
  --primary: #00aaff;
  --success: #4caf50;
  --fail: #f44336;
  --dark: #333;
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  padding:10px;
}

.card{
  width:100%;
  max-width:600px;
  background:#fff;
  border-radius:8px;
  padding:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  position:relative;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#word-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.word{
  background:#eee;
  border-radius:4px;
  padding:4px 8px;
}

.word-controls{
  margin-top:10px;
  text-align:center;
}

.word-controls button{
  font-size:1.2rem;
}

textarea{
  width:100%;
  margin-top:15px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:1rem;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.btn{
  flex:1 1 45%;
  padding:10px;
  font-size:1rem;
  border:none;
  border-radius:4px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}

.btn:active{
  transform:scale(0.98);
}

#feedback{
  margin-top:10px;
  min-height:24px;
}

#score-board{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:1.1rem;
}

#history-section{
  margin-top:20px;
}

#history li{
  font-size:0.9rem;
  margin-bottom:4px;
}

/* Animations */
.success{
  animation:pop 0.5s;
}

.fail{
  animation:shake 0.4s;
}

@keyframes pop{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

#emoji-container{
  pointer-events:none;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
}

.burst{
  position:absolute;
  top:50%;
  animation:rise 1s ease-out forwards;
  font-size:24px;
}

@keyframes rise{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-80px);opacity:0;}
}

.tip{
  margin-top:5px;
  font-size:0.9rem;
  color:var(--dark);
  min-height:20px;
}

.timer{
  font-weight:bold;
}
'use strict';

// Global state
const WORDS_URL = './data/words.json';
let words = [];
let currentWords = [];
let wordCount = 3;
let timerDuration = 30;
let timerRemaining = 0;
let timerInterval = null;
let totalScore = 0;
let currentLang = 'en';

const historyKey = 'clg_history';

// Tips
const tipsTPR = [
  'Act out throwing each word like a ninja star!',
  'Mime the action of the verb with your whole body.',
  'Pretend the noun is extremely heavy.',
  'Use your face to show the adjective strongly.'
];
const tipsExaggeration = [
  'Picture it 100 times bigger than normal.',
  'Imagine the word singing opera loudly.',
  'Think of the word wearing a silly costume.',
  'Visualize the word made of jelly.'
];
const tipPool = [...tipsTPR, ...tipsExaggeration];
let tipIdx = 0;

// i18n strings
const i18n = {
  en: {
    title: 'Chain Linking',
    newWords: 'New Words',
    hint: 'Hint',
    tpr: 'TPR idea',
