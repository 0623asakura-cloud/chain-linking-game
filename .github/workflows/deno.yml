    storyPlaceholder: 'Write a funny story...',
    langButton: '日本語',
    feedbackSuccess: ['Fantastic! 😂', 'LOL! Great job!', 'Hilarious! 🎉'],
    feedbackFail: ['Try again! Missing: ', 'Oops! You forgot: '],
    timeUp: 'Time\'s up!',
    linkCopied: 'Link copied!'
  },
  jp: {
    title: '連想チェーン',
    newWords: '新しい言葉',
    hint: 'ヒント',
    tpr: 'TPR案',
    reset: 'リセット',
    check: 'チェック',
