    storyPlaceholder: '面白いストーリーを書いて…',
    langButton: 'English',
    feedbackSuccess: ['最高！😂', '爆笑！素晴らしい！', 'ナイスチェーン！🎉'],
    feedbackFail: ['もう一度！足りない：', 'あれ？忘れた：'],
    timeUp: '時間切れ！',
    linkCopied: 'リンクをコピーしました'
