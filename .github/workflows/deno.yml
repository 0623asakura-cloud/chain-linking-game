# Chain Linking Game

A single-page Japanese vocabulary chain-linking game that uses humor, exaggerated imagery, and TPR ideas to help memorize words.

## Features

- Random 3–5 word sets (verbs, nouns, adjectives) with JP, romaji, and English.
- Write a short funny story using **all** words.
- Scoring with bonuses for length and emojis.
- Positive feedback, emoji burst animations, rotating tips.
- Timer mode (30s/60s) and multiplayer-lite round sharing.
- Saves the last 10 attempts in `localStorage` for spaced review.
- English/Japanese UI toggle.

## Run locally

Open `index.html` directly or start a local server:

